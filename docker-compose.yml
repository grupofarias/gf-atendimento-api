services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gf_atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gf_atendimento}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gf_atendimento}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  backup:
    build: ./docker/backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-gf_atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gf_atendimento}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      BACKUP_BUCKET: gf-atendimento-backups
    depends_on:
      - postgres
    deploy:
      restart_policy:
        condition: on-failure

  api:
    build: .
    ports:
      - '3200:3200'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gf_atendimento}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gf_atendimento}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_SECRET: ${APP_SECRET}
      MIDDLEWARE_API_KEY: ${MIDDLEWARE_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatwoot}
      NODE_ENV: production
      PORT: 3200
    depends_on:
      - postgres
      - redis
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
