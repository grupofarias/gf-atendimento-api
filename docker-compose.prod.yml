services:
  postgres:
    env_file: .env

  api:
    image: gf-atendimento-api:prod
    ports: []
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gf_atendimento}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gf_atendimento}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-gf_atendimento}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backup:
    image: gf-atendimento-backup:prod
    env_file: .env

  purge:
    image: postgres:16-alpine
    command: >
      sh -c "while true; do
        psql $$DATABASE_URL -c \"DELETE FROM processed_events WHERE created_at < NOW() - INTERVAL '48 hours'\";
        sleep 86400;
      done"
    env_file: .env
    deploy:
      replicas: 1
      restart_policy:
        condition: any
